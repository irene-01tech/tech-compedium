<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Irene's Tech Compendium</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.6/css/dataTables.dataTables.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo-section">
      <span class="code-icon">💻</span>
      <h3 class="logo">Irene's Tech Compendium</h3>
    </div>
    <ul class="nav-links">
      <li><span id="userGreeting" style="font-size: 14px; font-weight: 600; color: var(--accent-color);"></span></li>
      <li><button id="logoutBtn" class="btn btn-primary" style="margin: 0; padding: 8px 16px; font-size: 13px;">Logout</button></li>
    </ul>
  </div>
</nav>

<section class="container">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="dashboard-title">
      <h2>Compendium Dashboard</h2>
      <span id="roleBadge" class="role-badge"></span>
    </div>
  </div>

  <!-- Alerts -->
  <div id="alertBox" class="alert"></div>

  <!-- Admin Controls -->
  <div id="adminControls" class="dashboard-controls">
    <button class="btn primary" onclick="openAddTermModal()">➕ Add Term</button>
  </div>

  <!-- User Controls -->
  <div id="userControls" class="dashboard-controls">
    <button class="btn btn-csv" onclick="exportToCSV()">📊 CSV Export</button>
    <button class="btn btn-excel" onclick="exportToExcel()">📈 Excel Export</button>
    <button class="btn btn-pdf" onclick="exportToPDF()">📄 PDF Export</button>
    <button class="btn btn-print" onclick="printTable()">🖨️ Print</button>
    <button class="btn btn-copy" onclick="copyToClipboard()">📋 Copy</button>
  </div>

  <!-- Terms Table -->
  <div id="tableWrapper">
    <table id="termsTable" class="display">
      <thead>
        <tr>
          <th>Term</th>
          <th>Description</th>
          <th>Category</th>
          <th>Example</th>
          <th>Complexity</th>
          <th id="actionHeader">Action</th>
        </tr>
      </thead>
      <tbody id="termsTableBody"></tbody>
    </table>
    <div id="noResults" class="no-results" style="display: none;">
      <div class="no-results-icon">🔍</div>
      <p>No terms found. Try adjusting your search filters.</p>
    </div>
  </div>

</section>

<!-- Modal: Add/Edit Term -->
<div id="termModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Add New Term</h2>
      <button class="modal-close" onclick="closeTermModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="termForm" onsubmit="handleTermSubmit(event)">
        <input type="hidden" id="editingTermId" value="">
        <div class="form-group">
          <label for="termName">Term Name *</label>
          <input type="text" id="termName" placeholder="Enter term name" required>
        </div>
        <div class="form-group">
          <label for="termDesc">Description *</label>
          <textarea id="termDesc" placeholder="Enter detailed description" required></textarea>
        </div>
        <div class="form-group">
          <label for="termCategory">Category *</label>
          <input type="text" id="termCategory" placeholder="e.g., Networking, Programming, etc." required>
        </div>
        <div class="form-group">
          <label for="termExample">Example (Optional)</label>
          <input type="text" id="termExample" placeholder="Real-world example">
        </div>
        <div class="form-group">
          <label for="termComplexity">Complexity Level *</label>
          <select id="termComplexity" required>
            <option value="">Select Complexity</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeTermModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Term</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div id="deleteModal" class="modal">
  <div class="modal-content" style="max-width: 350px;">
    <div class="modal-header">
      <h2>Confirm Delete</h2>
      <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to delete this term?</p>
      <p id="deleteTermName" style="font-weight: 600; color: var(--accent-color);"></p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn secondary" onclick="closeDeleteModal()">Cancel</button>
      <button type="button" class="btn danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2025 Irene's Tech Compendium. All rights reserved.</p>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdn.datatables.net/2.3.6/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.6/js/dataTables.buttons.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.6/js/buttons.dataTables.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.6/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.6/js/buttons.print.min.js"></script>

<script src="script.js"></script>
</body>
</html>
