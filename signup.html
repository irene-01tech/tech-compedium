<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Irene's Tech Compendium</title>
  <link rel="stylesheet" 
     href="https://cdn.datatables.net/2.3.5/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <h3 class="logo">Irene's Tech Compendium</h3>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </div>
</nav>

<div class="auth-wrapper">
  <form class="contact-form" id="signupForm">
    <h3>Create Your Account</h3>
    
    <div id="signupAlert" class="alert"></div>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign Up</button>
    
    <p style="text-align: center; margin-top: 15px; font-size: 13px;">
      Already have an account? <a href="login.html">Login here</a>
    </p>
    
    <p style="text-align: center; margin-top: 10px; font-size: 12px; color: var(--text-light); background: rgba(255, 202, 44, 0.1); padding: 10px; border-radius: 6px;">
      💡 Tip: Using email <strong>irene@admin.com</strong>? You'll get Admin access!
    </p>
  </form>
</div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
